services:
  spring:
    build:
      context: "${PILAB_BUILD}/spring"
    entrypoint: ["java", "-jar", "/app/app.jar", "--server.port=8080"]
    environment:
      PILAB_MAIN_IP: "${PILAB_PREFIX}.11"
      PILAB_FIRE_IP: "${PILAB_PREFIX}.12"
      PILAB_AIR_IP: "${PILAB_PREFIX}.13"
      PILAB_LIGHT_IP: "${PILAB_PREFIX}.14"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8080/home/data"]
      interval: 1s
      timeout: 3s
      retries: 35
    networks:
      lab:
        ipv4_address: "${PILAB_PREFIX}.10"
  main:
    build:
      context: "${PILAB_BUILD}/pi"
    init: true
    tmpfs:
      - /board
    depends_on:
      spring:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: "${PILAB_PREFIX}.11"

networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: "${PILAB_PREFIX}.0/24"
